<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sports Pipeline Atlas</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
  /* A modern, bright atlas: a light page, a deep-blue globe with green land, slate ink and a violet accent.
     (--paper and friends keep their old names: they are the page's light background and panels.) */
  :root {
    --paper: #F4F6FB;
    --paper-hi: #FFFFFF;
    --panel: #FFFFFF;
    --ink: #111827;
    --dim: #374151;
    --muted: #64748B;
    --line: rgba(17, 24, 39, 0.2);
    --edge: rgba(17, 24, 39, 0.1);
    --sea-hi: #1F4E8C;
    --sea: #0F2D63;
    --sea-lo: #06132E;
    --land: #4ADE80;
    --accent: #7C3AED;
    --glow: rgba(124, 58, 237, 0.24);
    --on-globe: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--ink); font-family: 'Barlow', system-ui, sans-serif; }
  html {
    background-color: var(--paper);
    background-image: radial-gradient(ellipse at 50% 42%, #FFFFFF 0%, var(--paper) 55%, #E6ECF7 100%);
    background-attachment: fixed;
  }
  body { min-height: 100vh; display: flex; flex-direction: column; position: relative; }

  main, footer { position: relative; z-index: 1; }
  .cond { font-family: 'Plus Jakarta Sans', 'Barlow', system-ui, sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Ring (desktop / tablet) ---------- */
  #ring-view { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px 16px 16px; }
  #stage { position: relative; }
  #ring { position: absolute; left: 0; top: 0; width: 1180px; height: 1060px; transform-origin: 0 0; }
  #ring > svg.scale { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .scale .orbit { fill: none; stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 2 7; stroke-linecap: round; }
  .scale .rule { fill: none; stroke: var(--line); stroke-width: 1; }
  .scale .tick { stroke: var(--muted); stroke-width: 1; opacity: 0.6; }
  .scale .tick.major { stroke-width: 1.6; opacity: 0.9; }
  /* Only the chosen season's sports are on the ring; the others wait off it */
  #ring .away { display: none !important; }
  #ring .disc.enter, #ring .label.enter { animation: pop 0.32s ease-out both; }
  @keyframes pop { from { opacity: 0; scale: 0.7; } }

  /* The season picker: a small ring in three parts, top left */
  #ring-view { position: relative; }
  .season-pick { position: absolute; left: 30px; top: 26px; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .season-pick.right { left: auto; right: 30px; }
  .season-pick[hidden] { display: none; }
  .season-pick .seg text.tight { letter-spacing: 0.06em; font-size: 11px; }
  .season-pick .pk-head { padding: 4px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.9); font: 700 16px/1 'Plus Jakarta Sans', 'Barlow', system-ui, sans-serif; letter-spacing: 0.24em; text-transform: uppercase; color: var(--muted); }
  .season-pick svg { display: block; overflow: visible; }
  .season-pick .seg { cursor: pointer; outline: none; }
  /* the corner rings muted like the paint behind them (MUTE), so they don't glare */
  .season-pick svg { filter: saturate(0.6) brightness(1.04); }
  .season-pick .seg path.band { fill: var(--panel); stroke: var(--ink); stroke-width: 1.3; transition: fill 0.18s, stroke 0.18s; }
  .season-pick .seg text { font: 700 12.5px/1 'Plus Jakarta Sans', 'Barlow', system-ui, sans-serif; letter-spacing: 0.2em; text-transform: uppercase; fill: var(--ink); pointer-events: none; transition: fill 0.18s; }
  .season-pick .seg:hover path.band { fill: var(--paper-hi); stroke: var(--accent); }
  .season-pick .seg:hover text { fill: var(--accent); }
  .season-pick .seg[aria-checked="true"] path.band { fill: var(--accent); stroke: var(--accent); }
  .season-pick .seg[aria-checked="true"] text { fill: var(--paper-hi); }
  .season-pick .seg:focus-visible path.band { stroke: var(--ink); stroke-width: 2.5; }
  .season-pick .hub { fill: var(--paper-hi); stroke: var(--line); stroke-width: 1; }
  .season-pick .hub-n { font: 700 22px/1 'Plus Jakarta Sans', 'Barlow', system-ui, sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .season-pick .hub-w { font: 600 8px/1 'Barlow', system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; fill: var(--muted); text-anchor: middle; dominant-baseline: central; }
  @media (max-height: 760px), (max-width: 1100px) { .season-pick { top: 18px; } .season-pick svg { width: 150px; height: 150px; } }
  @media (max-height: 600px) { .season-pick svg { width: 116px; height: 116px; } .season-pick .pk-head { font-size: 13px; } }
  /* The seasons' colors: the page's tone follows the season picked (or violet for pro and high school maps) */
  body { --tone: #7C3AED; --tone-glow: rgba(124, 58, 237, 0.2); }
  body[data-tone="fall"] { --tone: #EA580C; --tone-glow: rgba(234, 88, 12, 0.22); }
  body[data-tone="winter"] { --tone: #0284C7; --tone-glow: rgba(2, 132, 199, 0.22); }
  body[data-tone="spring"] { --tone: #16A34A; --tone-glow: rgba(22, 163, 74, 0.22); }
  #ring { --accent: var(--tone); --glow: var(--tone-glow); }
  .scale .orbit { stroke: var(--tone); opacity: 0.6; transition: stroke 0.6s; }
  #seasonPick .seg[data-v="fall"] { --c: #EA580C; --t: #FFEDD5; }
  #seasonPick .seg[data-v="winter"] { --c: #0284C7; --t: #E0F2FE; }
  #seasonPick .seg[data-v="spring"] { --c: #16A34A; --t: #DCFCE7; }
  #seasonPick .seg path.band { fill: var(--t); stroke: var(--c); }
  #seasonPick .seg text { fill: var(--c); }
  #seasonPick .seg:hover path.band { fill: color-mix(in srgb, var(--c) 28%, white); stroke: var(--c); }
  #seasonPick .seg:hover text { fill: var(--c); }
  #seasonPick .seg[aria-checked="true"] path.band { fill: var(--g, var(--c)); stroke: var(--c); }
  #seasonPick .seg[data-v="fall"] { --g: url(#seasonPick-paint-fall); }
  #seasonPick .seg[data-v="winter"] { --g: url(#seasonPick-paint-winter); }
  #seasonPick .seg[data-v="spring"] { --g: url(#seasonPick-paint-spring); }
  /* the Maps ring takes three colors from the season showing (violets for pro and high school maps) */
  body #levelPick .seg[data-v="hs"] { --c: #A78BFA; } body #levelPick .seg[data-v="college"] { --c: #7C3AED; } body #levelPick .seg[data-v="pro"] { --c: #5B21B6; }
  body[data-tone="fall"] #levelPick .seg[data-v="hs"] { --c: #E08A00; } body[data-tone="fall"] #levelPick .seg[data-v="college"] { --c: #EA580C; } body[data-tone="fall"] #levelPick .seg[data-v="pro"] { --c: #B91C1C; }
  body[data-tone="winter"] #levelPick .seg[data-v="hs"] { --c: #2FA4D9; } body[data-tone="winter"] #levelPick .seg[data-v="college"] { --c: #1D6FB0; } body[data-tone="winter"] #levelPick .seg[data-v="pro"] { --c: #173F78; }
  body[data-tone="spring"] #levelPick .seg[data-v="hs"] { --c: #CA8A04; } body[data-tone="spring"] #levelPick .seg[data-v="college"] { --c: #16A34A; } body[data-tone="spring"] #levelPick .seg[data-v="pro"] { --c: #DB2777; }
  #levelPick .seg path.band { fill: color-mix(in srgb, var(--c) 14%, white); stroke: var(--c); transition: fill 0.5s, stroke 0.5s; }
  #levelPick .seg text { fill: var(--c); transition: fill 0.5s; }
  #levelPick .seg:hover path.band { fill: color-mix(in srgb, var(--c) 30%, white); stroke: var(--c); }
  #levelPick .seg:hover text { fill: var(--c); }
  #levelPick .seg[aria-checked="true"] path.band { fill: var(--c); stroke: var(--c); }
  #levelPick .seg[aria-checked="true"] text { fill: #FFFFFF; }
  .season-pick .hub { stroke: var(--tone); stroke-width: 1.4; transition: stroke 0.5s; }
  .season-pick .hub-n { fill: var(--tone); transition: fill 0.5s; }
  #seasonPick .seg[aria-checked="true"] text { fill: #FFFFFF; }
  .season-head.fall { color: #EA580C; } .season-head.winter { color: #0284C7; } .season-head.spring { color: #16A34A; }

  /* The sky behind everything: oil-paint strokes in the season's shades, bursting out from the globe (pale near it so the
     ring stays easy to read), and a faint latitude-longitude grid around the globe */
  .sky { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .sky .tone { position: absolute; inset: 0; opacity: 0; transition: opacity 0.7s ease; }
  .sky canvas.tone { width: 100%; height: 100%; }
  /* words over the paint: a soft white halo, and solid cards on phones */
  .label .n, .label .s { text-shadow: 0 0 3px #FFFFFF, 0 0 6px #FFFFFF, 0 0 10px rgba(255, 255, 255, 0.9); }
  .row { background: rgba(255, 255, 255, 0.9) !important; }
  .season-head { align-self: flex-start; padding: 3px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.92); }
  .list-head { padding: 14px 10px 16px; border-radius: 18px; background: rgba(255, 255, 255, 0.82); }
  /* a pale cloud behind the pickers and the legend, so they read clearly over the paint */
  .season-pick { padding: 10px; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.92) 70%, rgba(255, 255, 255, 0)); }
  #ring-view .legend { padding: 6px 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.82); box-shadow: 0 0 18px 8px rgba(255, 255, 255, 0.6); }
  footer { border-top-color: transparent; }
  body[data-tone="fall"] .sky .tone.fall, body[data-tone="winter"] .sky .tone.winter, body[data-tone="spring"] .sky .tone.spring,
  body[data-tone="pro"] .sky .tone.pro, body[data-tone="hs"] .sky .tone.pro { opacity: 1; }
  .sky svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sky .grid { fill: none; stroke: #FFFFFF; stroke-width: 1; opacity: 0.22; transition: stroke 0.7s; }
  .sky .grid.major { stroke-width: 1.4; opacity: 0.32; }
  .sky .edge { fill: none; stroke: #FFFFFF; stroke-width: 1.5; opacity: 0.3; transition: stroke 0.7s; }
  .scale .season { font: 800 17px/1 'Plus Jakarta Sans', 'Barlow', system-ui, sans-serif; letter-spacing: 0.18em; text-transform: uppercase; fill: var(--tone); text-anchor: middle; dominant-baseline: central; paint-order: stroke; stroke: var(--paper); stroke-width: 8px; }

  /* The globe */
  .center {
    position: absolute; left: 370px; top: 310px; width: 440px; height: 440px; border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, var(--sea-hi) 0%, var(--sea) 52%, var(--sea-lo) 100%);
    box-shadow: 0 0 0 1.5px var(--ink), 0 0 0 6px var(--paper), 0 0 0 7px var(--line), 0 18px 50px -24px rgba(17, 24, 39, 0.55), 0 0 60px -10px var(--glow);
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 22px; gap: 8px;
    overflow: hidden; transition: box-shadow 0.3s;
  }
  .center > :not(.earth):not(.earth-cv):not(.shade) { position: relative; }
  /* The Earth: continents drawn on the sea, turning on a tilted axis */
  .earth.real { display: none; }   /* the photo has no grid lines */
  .earth, .earth-cv { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .earth .land { fill: var(--land); stroke: #14532D; stroke-width: 0.6; stroke-linejoin: round; opacity: 0.92; }
  .earth .grat { fill: none; stroke: #FFFFFF; stroke-width: 0.7; opacity: 0.18; }
  .earth .eq { fill: none; stroke: #FFFFFF; stroke-width: 1; opacity: 0.4; stroke-dasharray: 5 4; }
  /* light from the upper left, a darker limb, and a soft pale wash behind the words so they stay readable */
  .shade { position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
    background:
      radial-gradient(circle at 50% 54%, rgba(15, 23, 42, 0.55) 0%, rgba(15, 23, 42, 0.35) 36%, rgba(15, 23, 42, 0) 60%),
      radial-gradient(circle at 34% 28%, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 42%),
      radial-gradient(circle at 50% 50%, rgba(0, 0, 0, 0) 62%, rgba(2, 6, 23, 0.45) 100%); }
  /* The spindle: the Earth's axis, sticking out past both poles */
  .scale .axis { stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; opacity: 0.8; }
  .scale .pin { fill: var(--paper-hi); stroke: var(--ink); stroke-width: 2; }
  .scale .pin-dot { fill: var(--ink); }
  .scale .pole { font: 700 17px/1 'Plus Jakarta Sans', 'Barlow', system-ui, sans-serif; fill: var(--ink); text-anchor: middle; dominant-baseline: central; }
  .kicker { font-size: 15px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--dim); }
  .center .kicker, .center .title, .center .hint, .gname { color: var(--on-globe); }
  .center .title { font-size: 76px; line-height: 0.95; margin: 0; letter-spacing: 0.01em; white-space: nowrap; align-self: stretch; }
  .center .title span, .list-head .title span { color: var(--accent); text-transform: none; letter-spacing: 0; font-size: 1em; transition: color 0.2s; }
  .center .title span { color: #C4B5FD; }
  .hint { margin: 0 0 14px; font-size: 21px; line-height: 1.35; color: var(--dim); max-width: 320px; }
  .center .kicker { font-size: 15px; }
  .center .hint { color: var(--on-globe); font-weight: 500; font-size: 20px; line-height: 1.25; margin-bottom: 8px; max-width: 330px; min-height: 50px; }
  .center .hint.stat { color: #DDD6FE; font-weight: 600; font-size: 18px; line-height: 1.25; }

  /* Sport discs: dashed when the sport has nothing on this side yet */
  .disc, .badge { border-radius: 50%; border: 1.5px dashed rgba(17, 24, 39, 0.42); background: var(--paper-hi); color: var(--muted); display: flex; align-items: center; justify-content: center; }
  .disc.live, .live > .pick > .badge { border-style: solid; border-color: var(--ink); background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 4px var(--paper-hi), inset 0 0 0 5px var(--edge); }
  .disc { position: absolute; left: 0; top: 0; width: 64px; height: 64px; padding: 0; cursor: pointer; font: inherit; transition: transform 0.18s ease, opacity 0.18s, box-shadow 0.18s, border-color 0.18s, background 0.18s, color 0.18s; }

  /* Lighting: the lit sport glows, the rest fade */
  .disc.lit { transform: scale(1.14); border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 6px var(--glow), 0 0 30px var(--glow); }
  .disc.live.lit { background: var(--accent); color: var(--paper-hi); box-shadow: inset 0 0 0 4px var(--accent), inset 0 0 0 5px rgba(255, 255, 255, 0.5), 0 0 0 6px var(--glow), 0 0 30px var(--glow); }
  /* The others fade, but only their icon and outline: a disc stays solid, so the rings pass behind it */
  #ring.has-lit .label:not(.lit), #ring.has-lit .disc:not(.lit) > svg { opacity: 0.4; }
  #ring.has-lit .disc:not(.lit) { border-color: rgba(17, 24, 39, 0.22); box-shadow: none; }
  .disc > svg { transition: opacity 0.18s; }


  /* The lit sport's page buttons fade in beside it */
  .sat {
    position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--accent); background: var(--paper-hi); color: var(--accent);
    display: flex; align-items: center; justify-content: center; text-decoration: none;
    opacity: 0; visibility: hidden; transform: scale(0.6);
    transition: opacity 0.16s, transform 0.16s, visibility 0s 0.16s;
  }
  .sat.lit { opacity: 1; visibility: visible; transform: none; transition: opacity 0.16s, transform 0.16s, visibility 0s; }
  a.sat.lit:hover { transform: scale(1.12); background: var(--accent); color: var(--paper-hi); }
  .sat.off { border: 1.5px dashed rgba(17, 24, 39, 0.42); color: var(--muted); }
  /* Each button's name, above or below it, so the names stay close to the disc and clear of the globe's title */
  .sat .tag { position: absolute; left: 50%; translate: -50% 0; padding: 2px 9px 3px; border-radius: 999px; background: var(--paper-hi); box-shadow: 0 0 0 1px var(--line);
    font-size: 15px; font-weight: 600; line-height: 1.2; white-space: nowrap; color: var(--accent); pointer-events: none; }
  .sat.men .tag { color: var(--men); translate: -70% 0; }      /* the two teams' names lean apart */
  .sat.women .tag { color: var(--women); translate: -30% 0; }
  .sat.off .tag { color: var(--muted); }
  .sat.side-t .tag { bottom: calc(100% + 6px); }
  .sat.side-b .tag { top: calc(100% + 11px); }
  /* A sport with both teams: two smaller circles a side, blue for men's and pink for women's, each with the
     man or woman figure on its edge */
  :root { --men: #2563EB; --women: #DB2777; }
  .sat.small { width: 38px; height: 38px; }
  /* the small ring the lit sport's page buttons sit on */
  .mini { position: absolute; left: 0; top: 0; width: 168px; height: 168px; border-radius: 50%; border: 1.5px dashed var(--accent);
    pointer-events: none; opacity: 0; transform: scale(0.6); transition: opacity 0.16s, transform 0.16s; }
  .mini.lit { opacity: 0.55; transform: none; }
  .sum .tl { display: block; font-size: 16px; }
  .center .hint .tl { display: block; font-size: 14px; white-space: nowrap; }
  .center .hint .tl.men { color: #93C5FD; }
  .center .hint .tl.women { color: #F9A8D4; }
  .sum .tl.men { color: var(--men); }
  .sum .tl.women { color: var(--women); }
  .sat.men { border-color: var(--men); color: var(--men); }
  .sat.women { border-color: var(--women); color: var(--women); }
  a.sat.men.lit:hover { background: var(--men); color: var(--paper-hi); }
  a.sat.women.lit:hover { background: var(--women); color: var(--paper-hi); }
  .sat .who { position: absolute; right: -6px; bottom: -6px; width: 18px; height: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--paper-hi); }
  .sat.men .who { background: var(--men); }
  .sat.women .who { background: var(--women); }
  .legend .men { color: var(--men); }
  .legend .women { color: var(--women); }
  .team { display: flex; flex-direction: column; gap: 6px; }
  .team .tlabel { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; }
  .team.men .tlabel { color: var(--men); }
  .team.women .tlabel { color: var(--women); }
  .team.men .btn:not(.off) { border-color: var(--men); }
  .team.men .btn:not(.ghost):not(.off) { background: var(--men); }
  .team.men .btn.ghost { color: var(--men); }
  .team.women .btn:not(.off) { border-color: var(--women); }
  .team.women .btn:not(.ghost):not(.off) { background: var(--women); }
  .team.women .btn.ghost { color: var(--women); }
  .disc:focus-visible, .sat:focus-visible, .btn:focus-visible, .pick:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* Each sport's name sits under its disc; a lit sport's drops below its small ring of buttons */
  .label { position: absolute; left: 0; top: 0; width: 170px; display: flex; flex-direction: column; align-items: center; text-align: center; pointer-events: none; gap: 1px; transition: opacity 0.18s; }
  .label .n { font-size: 14px; line-height: 1.1; color: var(--dim); letter-spacing: 0.06em; white-space: nowrap; }
  .label.lit { z-index: 6; }
  .label.lit .n { font-size: 18px; padding: 1px 10px 2px; border-radius: 999px; background: var(--paper); }
  .sat, .mini { z-index: 5; }
  .label.live .n, .label.lit .n { color: var(--ink); }
  .label .s { font: 600 17px/1.2 'Plus Jakarta Sans', 'Barlow', system-ui, sans-serif; color: var(--muted); min-height: 24px; }
  .label .s:empty { display: none; }   /* no Men's/Women's line (Football, Baseball, Softball): no blank gap */

  .legend { display: flex; gap: 28px; align-items: center; font-size: 14px; color: var(--muted); min-height: 20px; }
  .legend span { display: inline-flex; align-items: center; gap: 8px; }

  /* A clicked sport's maps, in the globe */
  .center.menu .kicker, .center.menu .title, .center.menu .hint, .center.menu .hsopen { display: none; }
  .gmaps { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; }
  .gmaps[hidden] { display: none; }
  .gname { font-size: 27px; letter-spacing: 0.04em; line-height: 1; color: var(--on-globe); }
  .gcols { display: flex; gap: 8px; justify-content: center; }
  .gcol { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 18px; }
  .gcols.one .gcol { display: grid; grid-template-columns: auto auto; gap: 3px 14px; justify-items: center; }
  .gcol b { font-size: 14px; font-weight: 700; color: inherit; }
  .gcol.men { color: #93C5FD; }
  .gcol.women { color: #F9A8D4; }
  .gcol a { font-weight: 600; color: var(--ink); text-decoration: none; white-space: nowrap; border-radius: 4px; padding: 0 5px; background: rgba(255, 255, 255, 0.92); }
  .gcol a:hover { background: var(--accent); color: var(--paper-hi); }
  .gcol .soon { font-style: italic; color: var(--muted); }

  /* Search by high school: a button in the globe (and atop the phone list) that opens a panel at full size.
     The globe scales with the window, so the button's words grow as it shrinks (--k, set in fit()). */
  .hsopen { min-height: 30px; padding: 3px 14px; border: 1px solid var(--ink); border-radius: 999px; background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap;
    font: 600 max(15px, calc(11.5px / var(--k, 1)))/1.2 'Barlow', system-ui, sans-serif; transition: background 0.2s, color 0.2s; }
  .gbtns { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }

<script>
  // ---- The sports: one disc per sport, from docs/sports.js (SPORT_DISCS) ----
  // build.py pages writes that list from the "site" part of each config/<sport>/settings.json, so a new sport

  //   id, name, icon; ring (fall, winter or spring); sub (a line under a one-team disc's name); teams: each with
  //     id    the sport's folder name (lacrosse-mens), which is also its ?sport= on the map pages
  //     sex   'm' or 'w' when the disc has both teams (two smaller circles each for players and coaches,

    'field-hockey': '<path d="M27 4.5L14.5 29c-1.7 3.3-6 3.5-7.6.9-1-1.7-.2-3.7 1.8-4.2"/><circle cx="28" cy="31" r="3.6"/>',

    'cross-country': '<path d="M3 33L14 14.5l6.5 9.5 5.5-7.5L37 33Z"/><path d="M14 14.5l3.5 7-3.5-1.5-3 2.5"/><circle cx="30" cy="8.5" r="3.2"/>',
    track: '<path d="M6.5 14h27M6.5 20.5h27M9.5 14v22M30.5 14v22M5.5 36h8M26.5 36h8"/>',
    swimming: '<circle cx="28" cy="13" r="4.2"/><path d="M5 22.5L15.5 11.5l9.5 7.5"/><path d="M3.5 28c3-3 6-3 9 0s6.2 3 9.2 0 6-3 9 0 3.300 2 5.300 1M3.5 34.5c3-3 6-3 9 0s6.2 3 9.2 0 6-3 9 0 3.300 2 5.300 1"/>',
    soccer: '<circle cx="20" cy="20" r="16"/><g stroke-width="1.5"><path d="M20.00 14.60L25.14 18.33L23.17 24.37L16.83 24.37L14.86 18.33Z" fill="currentColor"/><path d="M20.00 14.60L20.00 9.00"/><path d="M20.00 9.00L16.90 6.55L15.32 4.70A16 16 0 0 1 24.68 4.70L23.10 6.55Z" fill="currentColor"/><path d="M23.10 6.55L27.76 6.01M31.83 12.89L30.91 8.30"/><path d="M25.14 18.33L30.46 16.60"/><path d="M30.46 16.60L31.83 12.89L33.11 10.82A16 16 0 0 1 36.00 19.72L33.75 18.80Z" fill="currentColor"/><path d="M33.75 18.80L35.71 23.05M30.41 29.05L34.50 26.76"/><path d="M23.17 24.37L26.47 28.90"/><path d="M26.47 28.90L30.41 29.05L32.78 29.63A16 16 0 0 1 25.21 35.13L25.39 32.70Z" fill="currentColor"/><path d="M25.39 32.70L21.95 35.88M14.61 32.70L18.05 35.88"/><path d="M16.83 24.37L13.53 28.90"/><path d="M13.53 28.90L14.61 32.70L14.79 35.13A16 16 0 0 1 7.22 29.63L9.59 29.05Z" fill="currentColor"/><path d="M9.59 29.05L5.50 26.76M6.25 18.80L4.29 23.05"/><path d="M14.86 18.33L9.54 16.60"/><path d="M9.54 16.60L6.25 18.80L4.00 19.72A16 16 0 0 1 6.89 10.82L8.17 12.89Z" fill="currentColor"/><path d="M8.17 12.89L9.09 8.30M16.90 6.55L12.24 6.01"/></g>',
  };
  const JERSEY = '<path d="M8 3L4 5.5L2.5 10L5.5 11L6 9.5V21H18V9.5L18.5 11L21.5 10L20 5.5L16 3C15.3 4.6 13.8 5.5 12 5.5C10.2 5.5 8.7 4.6 8 3Z"/>';
  const WHISTLE = '<path d="M10 8H21V12H15.6A6 6 0 1 1 10 8Z"/><circle cx="10" cy="14" r="1.6"/><path d="M6.2 9.4L4.2 6.6"/><circle cx="3.4" cy="5.3" r="1.5"/>';
  // The universal man and woman figures, for the small badge on a team's circles
  const MAN = '<circle cx="12" cy="4.2" r="2.6"/><path d="M8.6 8.4h6.8c.9 0 1.6.7 1.6 1.6v5.4h-2.2V22h-2v-6h-1.6v6h-2v-6.6H7V10c0-.9.7-1.6 1.6-1.6Z"/>';
  const WOMAN = '<circle cx="12" cy="4.2" r="2.6"/><path d="M10 8.4h4c.8 0 1.4.5 1.6 1.2l2.2 7.4h-3.1V22h-2v-5h-1.4v5h-2v-5H6.2l2.2-7.4c.2-.7.8-1.2 1.6-1.2Z"/>';

  const KINDS = {
    players: { icon: JERSEY,  what: 'players',            label: 'Players',            short: 'Players · soon',  tag: 'players' },
    staff:   { icon: WHISTLE, what: 'coaches and staff',  label: 'Coaches &amp; staff', short: 'Staff · soon',  tag: 'coaches' },
  };

  function sportSvg(name, size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="${size > 50 ? 1.8 : size > 30 ? 2 : 2.4}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${SPORT_ICONS[name]}</svg>`;
  }
  function smallSvg(paths, size) {
    return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
  }

  const MAP_LINKS = [['players-dotmap', 'Recruiting Map'], ['players-heatmap', 'Footprints'], ['players-transfers', 'Transfer Map'],
    ['staff-moves', 'Coaching Moves'], ['staff-directory', 'Staff Directory'], ['school-influence', 'School Influence']];

  // ---- State: which sport is lit, which one a click pinned ----
  // The numbers come from each team's summary.json, written by build.py map with its map data;
  // the stats typed in above are only a fallback for when it can't load.
  const short = (n) => n >= 10000 ? `${Math.round(n / 1000)}K` : n.toLocaleString('en-US');
  SPORTS.forEach((s) => s.teams.filter((t) => t.built).forEach((t) => {
    fetch(`${t.id}/summary.json`).then((r) => r.ok ? r.json() : null).then((j) => {
      if (j && j.players && j.schools) { t.stats = [[j.schools.toLocaleString('en-US'), 'schools'], [short(j.players), 'players']]; render(); }
    }).catch(() => {});
  }));
  let lit = null, pinned = null, leaveTimer = null;

  const byId = (id) => SPORTS.find((s) => s.id === id);
  const paired = (s) => s.teams.length > 1;
  const teamName = (s, t) => s.name.toLowerCase() + (t && t.sex ? ` (${SEX[t.sex].word.toLowerCase()})` : s.sub ? ` (${s.sub.toLowerCase()})` : '');
  const fullName = (s) => teamName(s, paired(s) ? null : s.teams[0]);
  const isLive = (s) => s.teams.some((t) => t.players || t.staff);
  const stat = (t) => (t.stats || []).map(([v, k]) => `${v} ${k}`).join(' · ');
  function summary(s) {          // one line, or one per team for a sport with both
    if (!isLive(s)) return 'Coming soon';
    if (!paired(s)) return stat(s.teams[0]) || 'Live';
    return s.teams.map((t) => `${SEX[t.sex].word}: ${t.built ? (t.stats || []).map(([v, k]) => `${v} ${k}`).reverse().join(' · ') : 'coming soon'}`).join('\n');
  }
  // On the page, a sport with both teams gets a line per team in its color.
  const summaryHTML = (s) => !paired(s) || !isLive(s) ? esc(summary(s))
    : summary(s).split('\n').map((line, i) => `<span class="tl ${SEX[s.teams[i].sex].cls}">${esc(line)}</span>`).join('');
  const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // A page button on the ring: a link when the page exists, otherwise a "coming soon" marker. A team of a sport
  // with both gets a smaller circle in its color, with the man or woman figure on its edge.
  function satHTML(s, kind, t, side) {
    const k = KINDS[kind], href = t[kind], who = teamName(s, t);
    const sex = t.sex ? SEX[t.sex] : null;
    const cls = `sat side-${side}${sex ? ' small ' + sex.cls : ''}`, icon = smallSvg(k.icon, sex ? 19 : 20);
    const words = sex ? `${sex.word} ${k.tag}` : k.tag[0].toUpperCase() + k.tag.slice(1);
    const name = `<span class="tag" aria-hidden="true">${words}</span>`;
    const badge = sex ? `<span class="who" aria-hidden="true"><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">${t.sex === 'm' ? MAN : WOMAN}</svg></span>` : '';
    const team = ` data-team="${t.id}"`;
    if (href) return `<a class="${cls}" data-id="${s.id}" data-kind="${kind}"${team} href="${href}" aria-label="${who}: ${k.what}" title="${who} · ${k.what}">${icon}${badge}${name}</a>`;
    return `<span class="${cls} off" data-id="${s.id}" data-kind="${kind}"${team} role="img" aria-label="${who}: ${k.what}, coming soon" title="${who} · ${k.what} (coming soon)">${icon}${badge}${name}</span>`;
  }
  // The phone list's buttons: one row per team for a sport with both, in the team's color.
  function actionsHTML(s) {
    const row = (t) => t.built ? MAP_LINKS.map(([page, name], i) => `<a class="btn${i ? ' ghost' : ''}" href="${page}.html?sport=${t.id}">${name}</a>`).join('') : '<span class="btn off">Coming soon</span>';
    if (!paired(s)) return `<div class="actions">${row(s.teams[0])}</div>`;
    return s.teams.map((t) => `<div class="team ${SEX[t.sex].cls}"><span class="tlabel"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">${t.sex === 'm' ? MAN : WOMAN}</svg>${SEX[t.sex].word}</span><div class="actions">${row(t)}</div></div>`).join('');
  }

  // ---- Build the ring once (positions in a 1180×1020 box, scaled to fit) ----
  // One ring around the globe, holding one season's sports at a time; the picker at the top left changes it.
  const W = 1180, H = 1060, CX = W / 2, CY = H / 2, GLOBE = 200;
  const DISC = 32;                 // a disc's radius
  const SHOWN = 220;               // the globe's radius on the stage (GLOBE is its map's, inside the svg's 400×400)
  const ORBIT = { R: 432, start: 30 };
  const SEASONS = ['fall', 'winter', 'spring'].filter((id) => SPORTS.some((s) => s.ring === id));
  const OUTER = ORBIT.R;
  const rad = (d) => d * Math.PI / 180;
  const at = (deg, dist) => ({ x: CX + dist * Math.sin(rad(deg)), y: CY - dist * Math.cos(rad(deg)) });

  const ring = document.getElementById('ring');
  // The lit sport's page buttons sit on a small ring of their own around its disc, at these compass
  // angles (0 = up), the same wherever the disc is: players to the left and coaches to the right; with both
  // teams, men's on the left (players above, coaches below) and women's on the right.
  const MINI_R = 84;
  const SAT_AT = { players: { '': 270, m: 315, w: 45 }, staff: { '': 90, m: 225, w: 135 } };
  const items = SPORTS.map((s) => {
    const sats = [];
    let html = `<button type="button" class="disc" data-id="${s.id}" aria-pressed="false">${sportSvg(s.icon, 44)}</button>`;
    ['players', 'staff'].forEach((kind) => s.teams.forEach((t) => {
      const off = SAT_AT[kind][t.sex || ''];
      html += satHTML(s, kind, t, off > 270 || off < 90 ? 't' : 'b');
      sats.push({ kind, team: t.id, off: SAT_AT[kind][t.sex || ''], half: t.sex ? 19 : 20 });
    }));
    html += `<span class="mini" data-id="${s.id}" aria-hidden="true"></span>`;
    html += `<div class="label" data-id="${s.id}" aria-hidden="true"><span class="n cond">${s.name}</span><span class="s">${s.sub}</span></div>`;
    ring.insertAdjacentHTML('beforeend', html);
    const q = (sel) => ring.querySelector(`${sel}[data-id="${s.id}"]`);
    sats.forEach((x) => { x.el = ring.querySelector(`.sat[data-id="${s.id}"][data-kind="${x.kind}"]${x.team ? `[data-team="${x.team}"]` : ''}`); });
    return { id: s.id, ring: s.ring, pair: s.teams.length > 1, base: 0, disc: q('.disc'), mini: q('.mini'), sats, label: q('.label') };
  });

  // The pro leagues, for the Pro maps: each disc opens the Pro Pipeline on that league.
  const LEAGUE_DISCS = [
    { id: 'pro-nfl', lg: 'NFL', icon: 'football', sub: 'since 2016' }, { id: 'pro-nba', lg: 'NBA', icon: 'basketball', sub: 'since 2016' },
    { id: 'pro-mlb', lg: 'MLB', icon: 'baseball', sub: 'since 2016' }, { id: 'pro-nhl', lg: 'NHL', icon: 'hockey', sub: 'since 2016' }];
  LEAGUE_DISCS.forEach((L) => {
    ring.insertAdjacentHTML('beforeend', `<a class="disc live" data-id="${L.id}" href="pro-pipeline.html#lg=${L.lg}" aria-label="${L.lg}: high school to college to the pros">${sportSvg(L.icon, 44)}</a>`
      + `<div class="label live" data-id="${L.id}" aria-hidden="true"><span class="n cond">${L.lg}</span><span class="s">${L.sub}</span></div>`);
    items.push({ id: L.id, ring: 'pro', pro: L, pair: false, base: 0, disc: ring.querySelector(`.disc[data-id="${L.id}"]`), mini: null, sats: [],
      label: ring.querySelector(`.label[data-id="${L.id}"]`) });
  });
  const leagueOf = (id) => LEAGUE_DISCS.find((L) => L.id === id);

  // ---- Which maps: high school, college or pro ----
  // College maps show one season's sports (the season picker); pro maps the four leagues; high school maps are to come.
  const LEVELS = ['hs', 'college', 'pro'];
  const LEVEL_NAME = { hs: 'High school', college: 'College', pro: 'Pro' };
  const LEVEL_HINT = { hs: 'High school maps are coming. For now, search any high school to see its players in every sport.',
    college: 'Hover a sport, or click it for all its maps.', pro: 'Pick a league to follow its players from high school and college to the pros.' };
  const hashLevel = () => { const m = /(?:^#|&)level=(\w+)/.exec(location.hash); return m && LEVELS.includes(m[1]) ? m[1] : null; };
  let level = hashLevel() || 'college';
  const onRing = (it) => level === 'college' ? it.ring === season : level === 'pro' ? it.ring === 'pro' : false;
  function writeHash() {
    const h = level === 'college' ? `season=${season}` : `level=${level}`;
    try { history.replaceState(null, '', `#${h}`); } catch { /* a sandboxed preview */ }
  }

  // ---- The season on the ring ----
  // It opens on the season being played now (fall Jul-Nov, winter Dec-Feb, spring Mar-Jun), or the one in the
  // address (#season=winter), so a link keeps it.
  const nowSeason = () => { const m = new Date().getMonth(); return m >= 6 && m <= 10 ? 'fall' : m === 11 || m <= 1 ? 'winter' : 'spring'; };
  const hashSeason = () => { const m = /(?:^#|&)season=(\w+)/.exec(location.hash); return m && SEASONS.includes(m[1]) ? m[1] : null; };
  let season = hashSeason() || (SEASONS.includes(nowSeason()) ? nowSeason() : SEASONS[0]);
  const partsOf = (it) => [it.disc, it.mini, it.label, ...it.sats.map((x) => x.el)].filter(Boolean);
  function arrange(animate) {
    const mates = items.filter(onRing);
    items.forEach((it) => {
      const on = onRing(it);
      it.base = on ? ORBIT.start + mates.indexOf(it) * 360 / mates.length : 0;
      partsOf(it).forEach((el) => el.classList.toggle('away', !on));
      [it.disc, it.label].forEach((el) => { el.classList.remove('enter'); if (on && animate) { void el.offsetWidth; el.classList.add('enter'); } });
    });
  }
  arrange(false);

  // The dial between the globe and the ring: a dotted orbit plus a graduated scale, like a globe's meridian ring.
  (function buildDial() {
    const R1 = SHOWN + 18, R2 = SHOWN + 30;          // the graduated scale, just outside the globe
    let svg = `<circle class="orbit" cx="${CX}" cy="${CY}" r="${ORBIT.R}"/>`
      + `<circle class="rule" cx="${CX}" cy="${CY}" r="${R1}"/><circle class="rule" cx="${CX}" cy="${CY}" r="${R2}"/>`;
    for (let d = 0; d < 360; d += 5) {
      const major = d % 30 === 0, a = at(d, R1), b = at(d, major ? R2 : R1 + 6);
      svg += `<line class="tick${major ? ' major' : ''}" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"/>`;
    }
    document.getElementById('dial').innerHTML = svg;
  })();
  // The season's name, on the orbit at the top; the discs pass over it
  const ringName = () => level === 'college' ? season : level === 'pro' ? 'pro leagues' : 'high school maps · coming soon';
  const nameSeason = () => { document.getElementById('seasons').innerHTML = `<text class="season" x="${CX}" y="${CY - ORBIT.R}">${ringName()}</text>`; };
  nameSeason();
  const dial = document.getElementById('dial');

  // ---- The Earth ----
  // A real map of the land, seen from space, spinning west to east on an axis tilted 23.4° like the real one.
  // The map comes from the world-atlas package; if it can't load, the globe still shows its grid lines.
  const TILT = 23.4;
  const EARTH_SPIN = 4;          // the Earth turns this many times faster than the ring of sports
  const earthSvg = document.querySelector('.earth');
  const earthParts = { grat: earthSvg.querySelector('.grat'), eq: earthSvg.querySelector('.eq') };
  // The land is drawn on a canvas (the detailed 1:50m map is too many points to redraw as SVG while it turns),
  // in three colors: green land, tan desert and dry steppe, white ice (Greenland, Antarctica).
  const earthCv = document.querySelector('.earth-cv'), ectx = earthCv.getContext('2d');
  const LAND_COLORS = { green: '#4E8B3A', dry: '#A7A35A', desert: '#D2B07A', ice: '#EEF2F4' };
  const DESERT = new Set(['012', '434', '818', '729', '562', '466', '478', '148', '732', '682', '887', '512', '784', '634', '414',
    '368', '400', '760', '364', '004', '586', '795', '860', '036', '516', '072', '706', '262', '232', '788', '504', '048']);
  const DRY = new Set(['398', '496', '417', '762', '032', '152', '604', '710', '426', '894', '716', '231', '404', '686', '270',
    '854', '624', '044', '484', '840x']);
  const ICE = new Set(['304', '010', '260']);
  const hasD3 = typeof d3 !== 'undefined' && d3.geoOrthographic;
  const proj = hasD3 ? d3.geoOrthographic().scale(GLOBE).translate([GLOBE, GLOBE]).clipAngle(90).precision(0.5) : null;
  const geoPath = hasD3 ? d3.geoPath(proj) : null;
  const GRAT = hasD3 ? d3.geoGraticule().step([30, 30])() : null;
  const EQUATOR = { type: 'LineString', coordinates: [[-180, 0], [-90, 0], [0, 0], [90, 0], [180, 0]] };
  let lands = null, earthLon = -20, drawnLon = null;   // start with the Atlantic facing us
  const cpath = hasD3 ? d3.geoPath(proj, ectx) : null;

  function drawEarth(lon) {
    if (!hasD3) return;
    earthLon = lon;
    proj.rotate([lon, 0, -TILT]);    // the axis lies flat in the page, leaning 23.4° from upright with the north pole to the right
    earthParts.grat.setAttribute('d', geoPath(GRAT) || '');
    earthParts.eq.setAttribute('d', geoPath(EQUATOR) || '');
    if (drawnLon !== null && Math.abs(lon - drawnLon) < 0.2) return;   // about 30 redraws a second at most
    if (tex) { drawnLon = lon; drawPhoto(lon); return; }
    if (!lands) return;
    drawnLon = lon;
    ectx.setTransform(earthCv.width / 400, 0, 0, earthCv.height / 400, 0, 0);
    ectx.clearRect(0, 0, 400, 400);
    for (const [kind, shape] of lands) { ectx.beginPath(); cpath(shape); ectx.fillStyle = LAND_COLORS[kind]; ectx.fill(); }
    ectx.beginPath(); cpath(lands.outline); ectx.lineWidth = 0.45; ectx.strokeStyle = 'rgba(10, 30, 20, 0.55)'; ectx.stroke();
  }

  // The axle the Earth turns on, like a desk globe's: a rod through both poles, pinned at the dial.
  function drawAxis() {
    if (!hasD3) return;
    const north = proj([0, 90]);
    const dx = north[0] - GLOBE, dy = north[1] - GLOBE, len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const pt = (r) => [(CX + ux * r).toFixed(1), (CY + uy * r).toFixed(1)];
    const ang = (Math.atan2(uy, ux) * 180 / Math.PI + 90).toFixed(2);   // the rod's lean, for the labels
    let svg = '';
    for (const sgn of [1, -1]) {
      const a = pt(sgn * (SHOWN - 2)), b = pt(sgn * (SHOWN + 38)), cap = pt(sgn * (SHOWN + 42)), lab = pt(sgn * (SHOWN + 58));
      svg += `<line class="axis" x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>` +
             `<circle class="pin" cx="${cap[0]}" cy="${cap[1]}" r="6"/><circle class="pin-dot" cx="${cap[0]}" cy="${cap[1]}" r="2"/>` +
             `<text class="pole" x="${lab[0]}" y="${lab[1]}" transform="rotate(${ang} ${lab[0]} ${lab[1]})">${sgn > 0 ? 'N' : 'S'}</text>`;
    }
    document.getElementById('axis').innerHTML = svg;
  }

  // ---- The real Earth: NASA's Blue Marble (with a day's clouds) wrapped on the globe ----
  // docs/img/earth.jpg is a 2048×1024 world picture (latitude and longitude in a grid). Each pixel of the globe's
  // canvas knows once where on the picture it looks with the Earth unturned; turning the Earth only slides that
  // sideways, so a redraw is one quick pass. If the picture can't be read (the page opened as a file, say), the
  // drawn map below takes its place.
  const PHOTO_SIZE = 600;          // the canvas's pixels across (shown at 440 px; sharp and still quick to redraw)
  let tex = null;
  function drawPhoto(lon) {
    const { data, w, u0, row, px, out } = tex, shift = -lon / 360 * w;
    for (let k = 0; k < px.length; k++) {
      const a = u0[k];
      if (a < 0) { px[k] = 0; continue; }
      let u = (a + shift) % w;
      if (u < 0) u += w;
      px[k] = data[row[k] + (u | 0)];
    }
    ectx.setTransform(1, 0, 0, 1, 0, 0);
    ectx.putImageData(out, 0, 0);
  }
  function loadPhoto() {
    const img = new Image();
    img.onload = () => {
      try {
        const c = document.createElement('canvas');
        c.width = img.width; c.height = img.height;
        const g = c.getContext('2d');
        g.drawImage(img, 0, 0);
        const data = new Uint32Array(g.getImageData(0, 0, c.width, c.height).data.buffer);
        const n = PHOTO_SIZE, R = n / 2, u0 = new Float32Array(n * n).fill(-1), row = new Int32Array(n * n);
        const flat = d3.geoOrthographic().scale(R).translate([R, R]).clipAngle(90).rotate([0, 0, -TILT]);
        for (let y = 0; y < n; y++) {
          for (let x = 0; x < n; x++) {
            if ((x + 0.5 - R) ** 2 + (y + 0.5 - R) ** 2 > R * R) continue;
            const ll = flat.invert([x + 0.5, y + 0.5]);
            if (!ll || Number.isNaN(ll[0])) continue;
            const k = y * n + x;
            u0[k] = (ll[0] + 180) / 360 * c.width;
            row[k] = Math.min(c.height - 1, Math.max(0, Math.floor((90 - ll[1]) / 180 * c.height))) * c.width;
          }
        }
        earthCv.width = earthCv.height = n;
        const out = ectx.createImageData(n, n);
        tex = { data, w: c.width, u0, row, out, px: new Uint32Array(out.data.buffer) };
        earthSvg.classList.add('real');
        drawnLon = null; drawEarth(earthLon);
      } catch { tex = null; loadMap(); }
    };
    img.onerror = loadMap;
    img.src = 'img/earth.jpg';
  }
  function loadMap() {
    if (!hasD3 || typeof topojson === 'undefined') return;
    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-50m.json')
      .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
      .then((full) => {
        // the 1:50m map thinned of points too close to see on the globe (80,000 -> 17,000), so it turns smoothly
        const world = topojson.presimplify ? topojson.simplify(topojson.presimplify(full), 0.03) : full;
        const all = world.objects.countries.geometries, kind = (g) => ICE.has(g.id) ? 'ice' : DESERT.has(g.id) ? 'desert' : DRY.has(g.id) ? 'dry' : 'green';
        const merged = (k) => topojson.merge(world, all.filter((g) => kind(g) === k));
        lands = [['green', merged('green')], ['dry', merged('dry')], ['desert', merged('desert')], ['ice', merged('ice')]];
        lands.outline = topojson.mesh(world, world.objects.countries, (a, b) => a === b);   // the coastlines only
        drawnLon = null; drawEarth(earthLon);
      })
      .catch(() => {});
  }
  if (hasD3) loadPhoto();

  // Put every sport where it belongs for this much rotation (degrees).
  const put = (el, p, half) => { el.style.translate = `${(p.x - half).toFixed(2)}px ${(p.y - half).toFixed(2)}px`; };
  function place(rot) {
    items.forEach((it) => {
      if (!onRing(it)) return;
      const c = at(it.base + rot, ORBIT.R);
      put(it.disc, c, DISC);
      if (it.mini) put(it.mini, c, MINI_R);
      it.sats.forEach((x) => put(x.el, { x: c.x + MINI_R * Math.sin(rad(x.off)), y: c.y - MINI_R * Math.cos(rad(x.off)) }, x.half));
      // the name sits under the disc, or under its small ring of buttons when it's lit
      const below = it.id !== lit || it.pro ? DISC + 2 : it.pair ? MINI_R + 56 : MINI_R + 24;
      it.label.style.translate = `calc(${c.x.toFixed(2)}px - 50%) ${(c.y + below).toFixed(2)}px`;
    });
    dial.setAttribute('transform', `rotate(${rot.toFixed(3)} ${CX} ${CY})`);
    drawEarth(-20 + rot * EARTH_SPIN);
  }
  place(0);
  drawAxis();

  // ---- Draw everything that depends on the side ----
  const rowsEl = document.getElementById('rows');
  function render() {
    document.title = PAGE.doc;
    document.querySelectorAll('[data-role="title"]').forEach((el) => { el.innerHTML = PAGE.title; });
    document.querySelectorAll('[data-role="hint"]').forEach((el) => { el.textContent = PAGE.hint; });
    showHint();

    SPORTS.forEach((s) => {
      const live = isLive(s);
      ring.querySelectorAll(`.disc[data-id="${s.id}"], .label[data-id="${s.id}"]`).forEach((el) => el.classList.toggle('live', live));
      ring.querySelector(`.disc[data-id="${s.id}"]`).setAttribute('aria-label', `${fullName(s)}: ${summary(s)}`);
    });

    rowsEl.innerHTML = SPORTS.map((s, i) => `${!i || SPORTS[i - 1].ring !== s.ring ? `<h2 class="season-head ${s.ring}">${s.ring}</h2>` : ''}
      <div class="row${isLive(s) ? ' live' : ''}" data-id="${s.id}">
        <button type="button" class="pick" data-id="${s.id}" aria-expanded="false">
          <span class="badge">${sportSvg(s.icon, 32)}</span>
          <span><span class="n cond">${s.name}</span><span class="s">${s.sub ? s.sub + ' · ' : ''}${isLive(s) ? 'Live' : 'Coming soon'}</span></span>
        </button>
        <div class="more"><div class="sum">${summaryHTML(s)}</div>${actionsHTML(s)}</div>
      </div>`).join('');

    fitTitle();
    document.getElementById('legend').innerHTML = ['players', 'staff'].map((k) => `<span>${smallSvg(KINDS[k].icon, 18)}${KINDS[k].label}</span>`).join('')
      + Object.entries(SEX).map(([k, x]) => `<span class="${x.cls}"><svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">${k === 'm' ? MAN : WOMAN}</svg>${x.word}</span>`).join('');
    light(lit, true);
  }

  // The globe's title: as big as fits across the globe (76px at most), whichever font has loaded.
  function fitTitle() {
    const el = document.querySelector('.center .title');
    if (!el) return;
    let size = 76;
    el.style.fontSize = size + 'px';
    while (el.scrollWidth > el.clientWidth && size > 40) el.style.fontSize = (size -= 2) + 'px';
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);

  // ---- Lighting ----
  // The globe's line: the lit sport's numbers, or the hint when none is lit.
  function showHint() {
    const el = document.querySelector('.center [data-role="hint"]'), s = lit ? byId(lit) : null, L = lit ? leagueOf(lit) : null;
    el.classList.toggle('stat', !!(s || L));
    if (s) el.innerHTML = summaryHTML(s);
    else if (L) el.textContent = `${L.lg} players ${L.sub}: where they went to high school and college. Click to open.`;
    else el.textContent = LEVEL_HINT[level];
  }
  function light(id, quiet) {
    const changed = id !== lit;
    lit = id;
    showHint();
    if (changed) { try { place(rot); } catch { /* before the turning starts */ } }
    document.querySelectorAll('[data-id]').forEach((el) => el.classList.toggle('lit', el.dataset.id === id));
    globeMaps();
    keepTagsOnScreen();
    setTimeout(keepTagsOnScreen, 200);     // again once the buttons have grown to full size
    ring.classList.toggle('has-lit', !!id);
    rowsEl.classList.toggle('has-lit', !!id);
    ring.querySelectorAll('.disc').forEach((d) => d.setAttribute('aria-pressed', d.dataset.id === pinned ? 'true' : 'false'));
    rowsEl.querySelectorAll('.pick').forEach((p) => p.setAttribute('aria-expanded', p.dataset.id === id ? 'true' : 'false'));
    const s = id ? byId(id) : null;
    if (s && changed && !quiet) document.getElementById('say').textContent = `${fullName(s)}: ${summary(s).replace(/\n/g, '; ')}`;
  }
  // A clicked sport's maps, all of them, in the globe: one column per team for a sport with both.
  function globeMaps() {
    const el = document.getElementById('globeMaps'), s = pinned ? byId(pinned) : null, show = !!s && isLive(s);
    el.hidden = !show;
    el.parentElement.classList.toggle('menu', show);
    if (!show) return;
    const links = (t) => t.built ? MAP_LINKS.map(([page, name]) => `<a href="${page}.html?sport=${t.id}">${name}</a>`).join('') : '<span class="soon">Coming soon</span>';
    el.innerHTML = `<div class="gname cond">${s.name}</div><div class="gcols${paired(s) ? '' : ' one'}">${s.teams.map((t) =>
      `<div class="gcol ${t.sex ? SEX[t.sex].cls : ''}">${paired(s) ? `<b>${SEX[t.sex].word}</b>` : ''}${links(t)}</div>`).join('')}</div>`;
  }
  // A lit sport near the window's edge: a button's name that would run off it slides back in.
  function keepTagsOnScreen() {
    ring.querySelectorAll('.sat').forEach((sat) => {
      const tag = sat.querySelector('.tag');
      tag.style.marginLeft = '';
      if (!sat.classList.contains('lit')) return;
      const r = tag.getBoundingClientRect(), push = Math.max(0, 8 - r.left) || -Math.max(0, r.right - innerWidth + 8);
      if (r.width && push) tag.style.marginLeft = `${push / scaleK}px`;
    });
  }
  const settle = () => { clearTimeout(leaveTimer); leaveTimer = setTimeout(() => light(pinned), 320); };
  const sportOf = (el) => (el && el.closest ? el.closest('#ring [data-id]') : null);

  // Hover lights a sport; leaving it falls back to whichever one a click pinned.
  ring.addEventListener('mouseover', (e) => {
    const el = sportOf(e.target);
    if (!el) return;
    clearTimeout(leaveTimer);
    light(el.dataset.id);
  });
  ring.addEventListener('mouseout', (e) => {
    const from = sportOf(e.target), to = sportOf(e.relatedTarget);
    if (from && (!to || to.dataset.id !== from.dataset.id)) settle();
  });
  ring.addEventListener('focusin', (e) => { const el = sportOf(e.target); if (el) { clearTimeout(leaveTimer); light(el.dataset.id); } });
  ring.addEventListener('focusout', (e) => {
    const to = sportOf(e.relatedTarget);
    if (!to || to.dataset.id !== lit) settle();
  });

  // First click or tap pins a sport lit; a second one opens its page.
  ring.addEventListener('click', (e) => {
    const disc = e.target.closest('.disc');
    if (!disc || disc.tagName === 'A') return;      // a league's disc is a link to the Pro Pipeline
    const id = disc.dataset.id;
    if (pinned === id && lit === id) {            // a second click opens the page, when there is just one team
      const s = byId(id), page = !paired(s) && s.teams[0].players;
      if (page) location.href = page;
      return;
    }
    pinned = id;
    light(id);
  });

  // Phones: tapping a row opens it to show its summary and buttons.
  rowsEl.addEventListener('click', (e) => {
    const pick = e.target.closest('.pick');
    if (!pick) return;
    pinned = lit === pick.dataset.id ? null : pick.dataset.id;
    light(pinned);
  });

  // Clicking empty space or pressing Esc clears.
  document.getElementById('ring-view').addEventListener('click', (e) => {
    if (!e.target.closest('.disc, .sat, .center')) { pinned = null; light(null); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { pinned = null; light(null); } });

  // ---- The pickers: a ring cut in three, one part per choice, clockwise from the top ----
  // opts: el (the picker's box), ids, label(id), hub(id) -> [number or '', word], aria(id), tight (smaller letters),
  // current() and choose(id). Returns show(), to redraw it after a change.
  function ringPicker(opts) {
    const svg = opts.el.querySelector('svg');
    const RO = 62, RI = 30, GAP = 3, RT = (RO + RI) / 2;
    const pt = (deg, r) => `${(r * Math.sin(rad(deg))).toFixed(2)} ${(-r * Math.cos(rad(deg))).toFixed(2)}`;
    const n = opts.ids.length, span = 360 / n, key = opts.el.id;
    let html = '';
    opts.ids.forEach((id, i) => {
      const a = i * span + GAP / 2, b = (i + 1) * span - GAP / 2, mid = (a + b) / 2, big = b - a > 180 ? 1 : 0;
      const band = `M${pt(a, RO)} A${RO} ${RO} 0 ${big} 1 ${pt(b, RO)} L${pt(b, RI)} A${RI} ${RI} 0 ${big} 0 ${pt(a, RI)}Z`;
      // the name follows the arc, turned so it never reads upside down
      const low = mid > 90 && mid < 270;
      const arc = low ? `M${pt(b, RT)} A${RT} ${RT} 0 ${big} 0 ${pt(a, RT)}` : `M${pt(a, RT)} A${RT} ${RT} 0 ${big} 1 ${pt(b, RT)}`;
      html += `<g class="seg" role="radio" data-v="${id}" aria-label="${esc(opts.aria(id))}">`
        + `<path class="band" d="${band}"/><path id="${key}-arc-${id}" d="${arc}" fill="none"/>`
        + `<text${opts.tight ? ' class="tight"' : ''} dy="${low ? '0.75em' : '0.3em'}" dominant-baseline="middle"><textPath href="#${key}-arc-${id}" startOffset="50%" text-anchor="middle">${opts.label(id)}</textPath></text></g>`;
    });
    html += `<circle class="hub" r="${RI - 5}"/><text class="hub-n" y="-5"></text><text class="hub-w" y="12"></text>`;
    if (opts.paints) {          // a gradient per choice, for the picked part
      html = '<defs>' + Object.entries(opts.paints).map(([id, cs]) => `<linearGradient id="${key}-paint-${id}" x1="0" y1="0" x2="1" y2="1">`
        + cs.map((c, i) => `<stop offset="${(i / (cs.length - 1)).toFixed(2)}" stop-color="${c}"/>`).join('') + '</linearGradient>').join('') + '</defs>' + html;
    }
    svg.innerHTML = html;
    const segs = [...svg.querySelectorAll('.seg')];
    function show() {
      const cur = opts.current();
      segs.forEach((g) => { const on = g.dataset.v === cur; g.setAttribute('aria-checked', on); g.setAttribute('tabindex', on ? '0' : '-1'); });
      const [num, word] = opts.hub(cur);
      svg.querySelector('.hub-n').textContent = num;
      svg.querySelector('.hub-w').textContent = word;
      svg.querySelector('.hub-w').setAttribute('y', num === '' ? 0 : 12);
    }
    const pick = (id, focus) => { if (id !== opts.current()) opts.choose(id); show(); if (focus) svg.querySelector(`.seg[data-v="${id}"]`).focus(); };
    svg.addEventListener('click', (e) => { const g = e.target.closest('.seg'); if (g) pick(g.dataset.v); });
    svg.addEventListener('keydown', (e) => {
      const i = opts.ids.indexOf(opts.current());
      if (['ArrowRight', 'ArrowDown'].includes(e.key)) { e.preventDefault(); pick(opts.ids[(i + 1) % n], true); }
      else if (['ArrowLeft', 'ArrowUp'].includes(e.key)) { e.preventDefault(); pick(opts.ids[(i + n - 1) % n], true); }
      else if ((e.key === 'Enter' || e.key === ' ') && e.target.closest('.seg')) { e.preventDefault(); pick(e.target.closest('.seg').dataset.v, true); }
    });
    show();
    return show;
  }
  const sportsIn = (id) => SPORTS.filter((s) => s.ring === id).length;
  // after a change of season or level: the lit sport goes if it left the ring, the discs move in, the words follow
  function newRing() {
    const gone = (id) => id && !items.some((it) => it.id === id && onRing(it));
    if (gone(pinned) || gone(lit)) { pinned = null; light(null, true); }
    arrange(true);
    place(rot);
    nameSeason();
    showHint();
    document.querySelectorAll('[data-role="kicker"]').forEach((el) => { el.textContent = LEVEL_NAME[level]; });
    document.getElementById('seasonPick').hidden = level !== 'college';
    setTone();
    writeHash();
  }
  const showSeason = ringPicker({
    el: document.getElementById('seasonPick'), ids: SEASONS, label: (id) => id,
    paints: { fall: ['#FBBF24', '#F97316', '#DC2626', '#991B1B'], winter: ['#7FD0EE', '#2FA4D9', '#1D6FB0', '#173F78'], spring: ['#F9A8D4', '#F472B6', '#EC4899', '#BE185D'] },
    aria: (id) => `${id[0].toUpperCase() + id.slice(1)}: ${sportsIn(id)} sports`,
    hub: (id) => [sportsIn(id), 'sports'], current: () => season,
    choose: (id) => {
      season = id;
      newRing();
      document.getElementById('say').textContent = `${id}: ${SPORTS.filter((s) => s.ring === id).map((s) => s.name.toLowerCase()).join(', ')}`;
    },
  });
  const showLevel = ringPicker({
    el: document.getElementById('levelPick'), ids: LEVELS, tight: true, label: (id) => LEVEL_NAME[id],
    aria: (id) => `${LEVEL_NAME[id]} maps${id === 'hs' ? ' (coming soon)' : ''}`,
    hub: (id) => id === 'college' ? [SPORTS.length, 'sports'] : id === 'pro' ? [LEAGUE_DISCS.length, 'leagues'] : ['', 'soon'],
    current: () => level,
    choose: (id) => { level = id; newRing(); document.getElementById('say').textContent = `${LEVEL_NAME[id]} maps`; },
  });
  window.addEventListener('hashchange', () => {
    const lv = hashLevel() || 'college', se = hashSeason() || season;
    if (lv !== level || se !== season) { level = lv; season = se; newRing(); showSeason(); showLevel(); }
  });
  if (level !== 'college') { arrange(false); place(0); nameSeason(); document.getElementById('seasonPick').hidden = true; }
  // the page's tone: the season's color for college maps, violet for the others (CSS reads body[data-tone])
  function setTone() { document.body.dataset.tone = level === 'college' ? season : level; }
  setTone();
  document.querySelectorAll('[data-role="kicker"]').forEach((el) => { el.textContent = LEVEL_NAME[level]; });

  render();

  // ---- Search by high school ----
  // The schools come from build.py pages, read the first time the panel opens: docs/high_schools.json (schools with two or
  // more players, most first) and then docs/high_schools_more.json (the one-player schools), added to the end as it arrives.
  // A result links to that school on each sport's Recruiting Map; a row is [name, state, [sport, players, spelling?], ...].
  (function hsSearch() {
    const dlg = document.getElementById('hsq'), box = document.getElementById('hsInput'), out = document.getElementById('hsOut');
    const HOW = 'Type at least two letters. Results list every sport with a player from that school.';
    const LIMIT = 25;
    let rows = null, teams = [], ready = null;
    const load = () => ready || (ready = fetch('high_schools.json').then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }).then((j) => {
      teams = j.sports.map((id) => { const s = SPORTS.find((x) => x.teams.some((t) => t.id === id)); return s && { s, t: s.teams.find((t) => t.id === id) }; });
      rows = j.schools.map((r) => ({ r, q: `${r[0]} ${r[1]}`.toLowerCase() }));
      fetch('high_schools_more.json').then((r) => (r.ok ? r.json() : null)).then((m) => {
        if (!m) return;
        rows = rows.concat(m.schools.map((r) => ({ r, q: `${r[0]} ${r[1]}`.toLowerCase() })));
        if (dlg.open) show();
      }).catch(() => {});      // without it the search still has every school with two or more players
    }).catch((e) => { ready = null; throw e; }));
    const note = (text) => { out.innerHTML = `<p class="hsq-note">${esc(text)}</p>`; };
    function link([name, st], [i, n, own]) {
      const team = teams[i];
      if (!team) return '';
      const { s, t } = team, where = (own || name) + (st ? `~${st}` : '');
      return `<a class="${t.sex ? SEX[t.sex].cls : ''}" href="players-dotmap.html?sport=${t.id}#hs=${encodeURIComponent(where)}">${esc(s.name)}${t.sex ? ` (${t.sex === 'm' ? 'M' : 'W'})` : ''} ${n}</a>`;
    }
    function show() {
      const typed = box.value.trim().toLowerCase(), toks = typed.split(/[\s,]+/).filter(Boolean);
      if (typed.length < 2 || !toks.length) return note(HOW);
      if (!rows) return note('Loading the high schools…');
      const starts = (e) => e.q.startsWith(toks[0]) ? 0 : 1;
      const hits = rows.filter((e) => toks.every((t) => e.q.includes(t))).sort((a, b) => starts(a) - starts(b));   // the list is already most players first
      if (!hits.length) return note('No high school by that name yet.');
      const shown = hits.slice(0, LIMIT).map(({ r }) => {
        const total = r.slice(2).reduce((sum, x) => sum + x[1], 0);
        return `<div class="hsq-hit"><div class="hsq-name">${esc(r[0])}${r[1] ? ` <small>${esc(r[1])}</small>` : ''} <small>· ${total.toLocaleString('en-US')} player${total === 1 ? '' : 's'}</small></div>`
          + `<div class="hsq-sports">${r.slice(2).sort((a, b) => b[1] - a[1]).map((x) => link(r, x)).join('')}</div></div>`;
      }).join('');
      out.innerHTML = shown + (hits.length > LIMIT ? `<p class="hsq-note">Showing ${LIMIT} of ${hits.length.toLocaleString('en-US')}. Add a state or more of the name to narrow it.</p>` : '');
    }
    const retry = () => load().then(show).catch(() => note("The high schools didn't load. Close this and try again."));
    document.querySelectorAll('[data-hs-open]').forEach((b) => b.addEventListener('click', () => { dlg.showModal(); box.focus(); show(); retry(); }));
    box.addEventListener('input', show);
    document.getElementById('hsqClose').addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });   // a click on the dimmed page around it
  })();

  // ---- Scale the ring to fit the window ----
  const stage = document.getElementById('stage');
  let scaleK = 1;
  const ringViewEl = document.getElementById('ring-view'), legendEl = document.getElementById('legend');
  function fit() {
    // the room left for the globe: the ring area's height, minus its padding, the legend and the gap above it
    stage.style.width = stage.style.height = '0px';   // measure without the old size propping the area open
    const cs = getComputedStyle(ringViewEl);
    const roomH = ringViewEl.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - legendEl.offsetHeight - parseFloat(cs.rowGap || 0);
    const roomW = ringViewEl.clientWidth - 32;
    scaleK = Math.max(0.3, Math.min(1, roomW / W, roomH / H));
    ring.style.transform = `scale(${scaleK})`;
    ring.style.setProperty('--k', scaleK);
    ring.classList.toggle('tight', scaleK < 0.62);
    stage.style.width = W * scaleK + 'px';
    stage.style.height = H * scaleK + 'px';
  }
  window.addEventListener('resize', fit);
  fit();

  // ---- The sky's grid: a huge faint globe's latitude and longitude lines, centred on the real globe ----
  function drawSky() {
    const svg = document.getElementById('skyGrid');
    if (!hasD3 || !svg) return;
    const w = innerWidth, h = innerHeight, r = stage.getBoundingClientRect();
    const onRingView = ringViewEl.offsetParent !== null && r.width > 0;
    const cx = onRingView ? r.left + CX * scaleK : w / 2, cy = onRingView ? r.top + CY * scaleK : h * 0.32;
    const big = d3.geoOrthographic().scale(Math.max(w, h) * 0.72).translate([cx, cy]).rotate([-20, -16, -TILT]).clipAngle(90);
    const path = d3.geoPath(big);
    const minor = d3.geoGraticule().step([10, 10])(), major = d3.geoGraticule().step([30, 30])();
    paintSky(w, h, cx, cy);
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    svg.innerHTML = `<path class="grid" d="${path(minor) || ''}"/><path class="grid major" d="${path(major) || ''}"/>`
      + `<circle class="edge" cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${big.scale().toFixed(1)}"/>`;
  }
  // The paint: thick oil-paint strokes bursting out from the globe, in the season's colors, light in the middle and
  // deeper toward the edges (fall: golds to oranges to deep reds; winter: white to ice blue to navy; spring: pale
  // yellow through pinks and greens to magenta and leaf green; pro and high school maps: violets). Each band lists the
  // colors one stroke may take at that distance. The same every visit (a fixed seed).
  const PAINT = {
    fall: { seed: 11, bands: [['#FFF6DA', '#FFEFC2', '#FFF9E8'], ['#FFE08A', '#FFD166', '#FFE6A3'], ['#FFC23D', '#FFB703', '#FDBA74', '#FFCF5C'],
      ['#FB8500', '#F97316', '#FFA41B', '#F59E0B'], ['#EA580C', '#E04E10', '#F06A0F', '#D9480F'], ['#DC2626', '#C2361A', '#B91C1C', '#E0531F'],
      ['#9E2A1C', '#991B1B', '#7F1D1D', '#B4321A']] },
    winter: { seed: 23, bands: [['#FFFFFF', '#F8FCFF', '#F2FAFF'], ['#E6F6FF', '#DDF3FB', '#EEF8FF'], ['#BDE8F7', '#A5DDF2', '#C9EDF9'],
      ['#7FD0EE', '#5FC3EA', '#67C6E3', '#8ED7F0'], ['#2FA4D9', '#3B9DD6', '#1E90C8', '#45B0E0'], ['#1C7FC0', '#1D6FB0', '#1A5E9E', '#2387C8'],
      ['#173F78', '#14366A', '#102A55', '#1C4B8A']] },
    spring: { seed: 37, bands: [['#FFFEF5', '#FFFBEA', '#FFF8FB'], ['#FFF6B8', '#FEF3C7', '#FDF2F8', '#F0FDF4'], ['#FDE68A', '#FBCFE8', '#D9F99D', '#FDE047'],
      ['#F9A8D4', '#BEF264', '#FDE047', '#86EFAC'], ['#F472B6', '#86EFAC', '#A3E635', '#FB7185'], ['#EC4899', '#4ADE80', '#DB2777', '#22C55E'],
      ['#BE185D', '#16A34A', '#9D174D', '#15803D']] },
    pro: { seed: 51, bands: [['#FFFFFF', '#FAF7FF', '#FDFBFF'], ['#EDE9FE', '#F3E8FF', '#F5F3FF'], ['#DDD6FE', '#E9D5FF', '#E0E7FF'],
      ['#C4B5FD', '#D8B4FE', '#C7D2FE'], ['#A78BFA', '#C084FC', '#A5B4FC'], ['#8B5CF6', '#7C3AED', '#9333EA'], ['#6D28D9', '#5B21B6', '#4C1D95', '#581C87']] },
  };
  function seeded(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const shade = (hex, k) => {                    // k > 0 lighter (toward white), k < 0 darker
    const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map((v) => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k)));
    return `rgb(${c[0]}, ${c[1]}, ${c[2]})`;
  };
  // How calm the paint is: each color keeps SAT of its saturation and is moved LIFT of the way toward light, so the
  // palettes above stay recognisable but don't glare (Nov 22: the full colors were too bright behind the ring).
  const MUTE = { sat: 0.5, lift: 0.3 };
  const muteCache = new Map();
  function mute(hex) {
    if (muteCache.has(hex)) return muteCache.get(hex);
    const n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    let hue = 0, l = (mx + mn) / 2, sat = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
    if (d) hue = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
    sat *= MUTE.sat; l += (0.9 - l) * MUTE.lift;
    const c = (1 - Math.abs(2 * l - 1)) * sat, x = c * (1 - Math.abs((hue % 2 + 2) % 2 - 1)), m = l - c / 2;
    const [rr, gg, bb] = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][((Math.floor(hue) % 6) + 6) % 6];
    const out = '#' + [rr, gg, bb].map((v) => Math.round((v + m) * 255).toString(16).padStart(2, '0')).join('');
    muteCache.set(hex, out);
    return out;
  }
  function paintCanvas(cv, kind, w, h, cx, cy) {
    const P = PAINT[kind], rnd = seeded(P.seed), nb = P.bands.length;
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    const far = Math.max(Math.hypot(cx, cy), Math.hypot(w - cx, cy), Math.hypot(cx, h - cy), Math.hypot(w - cx, h - cy));
    const under = g.createRadialGradient(cx, cy, 0, cx, cy, far);      // the wash under the strokes
    P.bands.forEach((band, i) => under.addColorStop(i / (nb - 1), mute(band[0])));
    g.fillStyle = under; g.fillRect(0, 0, w, h);
    g.lineCap = 'round';
    const n = Math.round(w * h / 120);
    for (let i = 0; i < n; i++) {
      const x = rnd() * w, y = rnd() * h, dx = x - cx, dy = y - cy, dist = Math.hypot(dx, dy);
      const t = Math.min(0.999, Math.max(0, (dist / far) ** 0.8 + (rnd() - 0.5) * 0.16));
      const band = P.bands[Math.floor(t * nb)], color = mute(band[Math.floor(rnd() * band.length)]);
      const ang = Math.atan2(dy, dx) + 0.45 * Math.sin(dist / 85 + Math.atan2(dy, dx) * 3) + (rnd() - 0.5) * 0.7;
      const len = 16 + rnd() * 36 * (0.55 + t), wid = 5 + rnd() * 11 * (0.55 + t), bend = (rnd() - 0.5) * len * 0.7;
      const ux = Math.cos(ang), uy = Math.sin(ang), px = -uy, py = ux;
      const ax = x - ux * len / 2, ay = y - uy * len / 2, bx = x + ux * len / 2, by = y + uy * len / 2, qx = x + px * bend, qy = y + py * bend;
      const line = (off, width, style, alpha) => {
        g.globalAlpha = alpha; g.strokeStyle = style; g.lineWidth = width;
        g.beginPath(); g.moveTo(ax + px * off, ay + py * off); g.quadraticCurveTo(qx + px * off, qy + py * off, bx + px * off, by + py * off); g.stroke();
      };
      line(wid * 0.3, wid * 0.9, shade(color, -0.16), 0.3);      // the stroke's shadow side
      line(0, wid, color, 0.95);                                  // the paint
      line(-wid * 0.28, wid * 0.28, shade(color, 0.45), 0.4);   // the light catching its ridge
    }
    g.globalAlpha = 1;
  }
  // The season showing is painted first; the others follow a moment later, one at a time, so the page opens quickly.
  function paintSky(w, h, cx, cy) {
    const kinds = ['fall', 'winter', 'spring', 'pro'], now = document.body.dataset.tone === 'hs' ? 'pro' : document.body.dataset.tone;
    const order = [now, ...kinds.filter((k) => k !== now)].filter((k) => kinds.includes(k));
    const run = (i) => {
      if (i >= order.length) return;
      paintCanvas(document.querySelector(`.sky canvas.tone.${order[i]}`), order[i], w, h, cx, cy);
      setTimeout(() => run(i + 1), 60);
    };
    run(0);
  }
  let skyTimer = null;
  window.addEventListener('resize', () => { clearTimeout(skyTimer); skyTimer = setTimeout(drawSky, 120); });
  drawSky();

  // ---- The slow turn ----
  // One full turn every 200 seconds. It eases to a stop while the mouse is over the globe and its ring,
  // or while a sport is lit, and picks up again when you move away. Reduced motion: it stays still.
  const TURN = 360 / 200;   // degrees per second
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  const ringView = document.getElementById('ring-view');
  let rot = 0, speed = still.matches ? 0 : TURN, hovering = false, last = null;

  document.addEventListener('pointermove', (e) => {
    if (e.pointerType !== 'mouse' && e.pointerType !== 'pen') return;
    const r = stage.getBoundingClientRect();
    const dx = e.clientX - (r.left + CX * scaleK), dy = e.clientY - (r.top + CY * scaleK);
    hovering = Math.hypot(dx, dy) < (OUTER + 50) * scaleK;
  });
  document.documentElement.addEventListener('pointerleave', () => { hovering = false; });

  function tick(t) {
    const dt = last == null ? 0 : Math.min(0.1, (t - last) / 1000);
    last = t;
    const target = still.matches || hovering || lit || pinned ? 0 : TURN;
    speed += (target - speed) * Math.min(1, dt * 3);
    if (speed > 0.001 && ringView.offsetParent !== null) {
      rot = (rot + speed * dt) % 360;
      place(rot);
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
